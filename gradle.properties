org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official

# Single source of truth for the app's marketing version.
# Read by app/build.gradle.kts and by .github/workflows/android.yml, so the
# published update manifest can never disagree with the APK it describes.
aibrief.versionName=2.1.0

# Floor for every generated versionCode. Kept above the highest value ever
# published by hand so the automated sequence can only ever climb.
aibrief.versionCodeBase=100
