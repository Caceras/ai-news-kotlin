name: Build signed Play bundle

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: An unused version code higher than every prior Play upload
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: play-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore private upload key
        env:
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          names = ['PLAY_KEYSTORE_BASE64', 'PLAY_STORE_PASSWORD', 'PLAY_KEY_ALIAS', 'PLAY_KEY_PASSWORD']
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Configure repository secrets first: ' + ', '.join(missing))
          key = Path('.play-upload.jks')
          key.write_bytes(base64.b64decode(os.environ['PLAY_KEYSTORE_BASE64'], validate=True))
          key.chmod(0o600)
          def escape(value):
              return ''.join(('\\u%04x' % ord(c)) if ord(c) > 127 else
                             {'\\':'\\\\','\n':'\\n','\r':'\\r','=':'\\=',':':'\\:',' ':'\\ '}.get(c,c)
                             for c in value)
          values = {'storeFile': str(key.resolve()), 'storePassword': os.environ['PLAY_STORE_PASSWORD'],
                    'keyAlias': os.environ['PLAY_KEY_ALIAS'], 'keyPassword': os.environ['PLAY_KEY_PASSWORD']}
          props = Path('keystore.properties')
          props.write_text('\n'.join(k + '=' + escape(v) for k,v in values.items()) + '\n')
          props.chmod(0o600)
          PY
      - name: Validate and build
        env:
          PLAY_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          [[ "$PLAY_VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]] || { echo 'Invalid version code'; exit 1; }
          (( PLAY_VERSION_CODE <= 2100000000 )) || { echo 'Version code is too large'; exit 1; }
          python3 scripts/publish-post.py --validate
          scripts/ci-gradle.sh testReleaseUnitTest lintRelease bundleRelease -PbuildNumber=0 -Paibrief.versionCodeBase="$PLAY_VERSION_CODE"
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          sha256sum app/build/outputs/bundle/release/app-release.aab > app/build/outputs/bundle/release/SHA256SUMS.txt
      - name: Upload private Play bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-brief-play-${{ inputs.version_code }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/bundle/release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Remove signing files
        if: always()
        run: rm -f .play-upload.jks keystore.properties
